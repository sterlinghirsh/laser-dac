<!DOCTYPE html>
<html>
    <head>
        <title>Ether Dream Simulator</title>
        <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
        <style>
            html, body {
                height: 100%;
            }
            body {
                background: #000;
                color: #fff;
                font-family: sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0;
            }
            #canvas {
                border: 2px solid #333;
                max-width: 800px;
                width: 100vmin;
                max-height: 800px;
                height: 100vmin;
            }
            /* Embedded (iframe) mode: canvas fills the width and the
               controls dock below it instead of overlaying it. */
            body.embed {
                flex-direction: column;
                justify-content: flex-start;
                height: auto;
            }
            body.embed #canvas {
                width: calc(100vw - 4px);
                height: calc(100vw - 4px);
                box-sizing: border-box;
            }
            #gui-container {
                display: none;
            }
            body.embed #gui-container {
                display: block;
                margin-top: 4px;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div id="gui-container"></div>
        <script src="./index.js" type="module"></script>
    </body>
</html>
